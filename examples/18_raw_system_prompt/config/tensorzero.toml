# TensorZero configuration for the raw-system-prompt example.
#
# Contrast with examples/03_system_prompt/config/tensorzero.toml — that
# function declares ``system_template`` and (optionally) a system schema
# so prompts live in config and only template variables flow at runtime.
# This function declares **no** ``schemas.system.path`` and **no**
# ``system_template``, which is the precondition for TensorZero to
# accept ``input.system`` as a raw string (per the gateway API
# reference).  That's what enables the ``system="..."`` kwarg on
# ``Agent.invoke`` to flow through unchanged.
#
# See: https://www.tensorzero.com/docs/gateway/api-reference

[gateway]
bind_address = "0.0.0.0:3000"

# --- Model -------------------------------------------------------------------

[models.gpt_oss_20]
routing = ["groq"]

[models.gpt_oss_20.providers.groq]
type = "groq"
model_name = "openai/gpt-oss-20b"

# --- Function ----------------------------------------------------------------
# IMPORTANT: no system schema, no system_template.  Adding either would
# make the gateway reject a raw ``input.system`` string with HTTP 400.

[functions.agent]
type = "chat"

[functions.agent.variants.gpt_oss_20]
type = "chat_completion"
model = "gpt_oss_20"
