# TensorZero configuration demonstrating a system prompt for tool-using agents.
#
# The system_template directive tells TensorZero to inject a system message
# at the start of every conversation.  The template is a Minijinja file
# (plain text with optional {{ variable }} interpolation).
#
# See: https://www.tensorzero.com/docs/gateway/configuration

[gateway]
bind_address = "0.0.0.0:3000"

# --- Model -------------------------------------------------------------------

[models.gpt_oss_20]
routing = ["groq"]

[models.gpt_oss_20.providers.groq]
type = "groq"
model_name = "openai/gpt-oss-20b"

# --- Function -----------------------------------------------------------------

[functions.agent]
type = "chat"

[functions.agent.variants.baseline]
type = "chat_completion"
model = "gpt_oss_20"
# Path is relative to this config directory.
system_template = "functions/agent/baseline/system.txt"

# --- Metrics (for feedback) ---------------------------------------------------

[metrics.task_success]
type = "boolean"
level = "episode"
optimize = "max"

[metrics.quality_score]
type = "float"
level = "inference"
optimize = "max"
