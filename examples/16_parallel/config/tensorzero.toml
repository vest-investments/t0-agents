# TensorZero gateway configuration for the parallel-tools demos.
#
# Defines four chat functions so the two demos share one gateway:
#
# - ``fetch_agent``  — used by 01_parallel_tools.py (single agent that
#   fetches multiple URLs).
# - ``research``     — researcher sub-agent (02_parallel_subagents.py).
# - ``writing``      — writer sub-agent (02_parallel_subagents.py).
# - ``orchestrator`` — parent agent that delegates to researcher_ask
#   and writer_ask (02_parallel_subagents.py).

[gateway]
bind_address = "0.0.0.0:3000"

[models.groq_model]
routing = ["groq"]

[models.groq_model.providers.groq]
type = "groq"
model_name = "openai/gpt-oss-20b"

[functions.fetch_agent]
type = "chat"

[functions.fetch_agent.variants.default]
type = "chat_completion"
model = "groq_model"

[functions.research]
type = "chat"

[functions.research.variants.default]
type = "chat_completion"
model = "groq_model"

[functions.writing]
type = "chat"

[functions.writing.variants.default]
type = "chat_completion"
model = "groq_model"

[functions.orchestrator]
type = "chat"

[functions.orchestrator.variants.default]
type = "chat_completion"
model = "groq_model"
