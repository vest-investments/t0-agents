# TensorZero gateway configuration for the multi-agent example.
#
# Declares three functions so each agent has its own inference record
# in ClickHouse:
#
# - ``research``  — the researcher sub-agent (arXiv tool access).
# - ``writing``   — the writer sub-agent (markdown formatting).
# - ``orchestrator`` — the parent agent, sees ``researcher_ask`` and
#   ``writer_ask`` as tools (installed at Agent construction time by
#   :func:`t0_agents.compose.install_sub_agents`).
#
# All three use the same model for simplicity; a production setup would
# typically vary model / temperature per agent role.

[gateway]
bind_address = "0.0.0.0:3000"

[models.groq_model]
routing = ["groq"]

[models.groq_model.providers.groq]
type = "groq"
model_name = "openai/gpt-oss-20b"

# ---------------------------------------------------------------------------
# Researcher — "find papers relevant to the topic"
# ---------------------------------------------------------------------------

[functions.research]
type = "chat"

[functions.research.variants.default]
type = "chat_completion"
model = "groq_model"

# ---------------------------------------------------------------------------
# Writer — "produce a polished markdown deliverable"
# ---------------------------------------------------------------------------

[functions.writing]
type = "chat"

[functions.writing.variants.default]
type = "chat_completion"
model = "groq_model"

# ---------------------------------------------------------------------------
# Orchestrator — delegates to researcher_ask and writer_ask
# ---------------------------------------------------------------------------

[functions.orchestrator]
type = "chat"

[functions.orchestrator.variants.default]
type = "chat_completion"
model = "groq_model"
