[project]
name = "t0-agents"
version = "1.0.0"
description = "The Pythonic agentic framework for TensorZero"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Gustavo Vera", email = "ing.vera.velasco@gmail.com" },
]
keywords = ["tensorzero", "agents", "mcp", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.2.3",
    "tensorzero>=2026.4.0",
]

[project.optional-dependencies]
memory-sqlite = ["aiosqlite>=0.20.0"]
pydantic = ["pydantic>=2.0"]
serve = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "sse-starlette>=2.0",
]
cli = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "sse-starlette>=2.0",
]
glow = [
    "pydantic>=2.0",
]

[project.scripts]
t0-agents = "t0_agents.cli.app:main"

[project.urls]
Repository = "https://github.com/sproutfi/t0-agents"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t0_agents"]

# --- Tools ---

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires T0 Gateway running (deselect with '-m not integration')",
    "embedded: requires an embedded T0 Gateway and a provider API key; opt-in via RUN_EMBEDDED_TESTS=1 (deselect with '-m not embedded')",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

# ``src/t0_agents/mcp/`` is the standalone submodule (invariant §2.1
# of the v1.0 integration contract — ``git diff src/t0_agents/mcp/``
# must show zero changes across milestones).  v1.0 (M3) made
# :class:`AgentResult` generic in ``T``, but ``mcp/loop.py:run_agent``
# returns the bare ``AgentResult`` type by design.  Relax
# ``disallow_any_generics`` for this module only so the strict check
# does not force a modification.
[[tool.mypy.overrides]]
module = "t0_agents.mcp.*"
disallow_any_generics = false

[dependency-groups]
dev = [
    "coverage>=7.13.5",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]
