# TensorZero gateway configuration

[gateway]
bind_address = "0.0.0.0:3000"

[models.gpt_oss_20]
routing = ["groq"]

[models.gpt_oss_20.providers.groq]
type = "groq"
model_name = "openai/gpt-oss-20b"

[functions.agent]
type = "chat"

[functions.agent.variants.gpt_oss_20]
type = "chat_completion"
model = "gpt_oss_20"

# Schema-declared variant for integration coverage of `system_arguments`.
# The strict schema rejects any payload shape other than the one described,
# which catches the wrapper-bug class of regressions automatically.
[functions.agent_with_schema]
type = "chat"
schemas.system.path = "functions/agent_with_schema/system_schema.json"

[functions.agent_with_schema.variants.gpt_oss_20]
type = "chat_completion"
model = "gpt_oss_20"
templates.system.path = "functions/agent_with_schema/system.minijinja"

# Structured-outputs surface: JSON function used by the
# structured-outputs example (examples/03_output_modes/) and the
# tests/test_core/test_structured_integration.py integration tests.
[functions.extract_customer_info]
type = "json"
output_schema = "functions/extract_customer_info/output_schema.json"

[functions.extract_customer_info.variants.gpt_oss_20]
type = "chat_completion"
model = "gpt_oss_20"
templates.system.path = "functions/extract_customer_info/system_template.minijinja"
json_mode = "strict"

# Structured-outputs surface — dynamic-schema example: NER function
# used by ``examples/03_output_modes/ner_dynamic_schema.py`` to exercise
# per-call ``output_schema`` overrides and a per-call ``json_mode``
# swap (TZ guide §4).
[functions.extract_entities]
type = "json"
output_schema = "functions/extract_entities/output_schema.json"

[functions.extract_entities.variants.gpt_oss_20]
type = "chat_completion"
model = "gpt_oss_20"
templates.system.path = "functions/extract_entities/system_template.minijinja"
json_mode = "strict"

# Structured-outputs surface — glow example: trip-planner JSON function
# used by ``examples/glow/02_structured.py`` and
# ``tests/test_glow/test_integration.py``.  Schema matches the
# ``TripPlan(BaseModel)`` defined in the example so the glow decorator's
# return-type inference picks ``StructuredOutput`` cleanly.  Mirrored
# from ``examples/glow/config/`` so the root gateway covers every
# integration test in one boot.
[functions.plan_trip]
type = "json"
output_schema = "functions/plan_trip/output_schema.json"

[functions.plan_trip.variants.gpt_oss_20]
type = "chat_completion"
model = "gpt_oss_20"
templates.system.path = "functions/plan_trip/system_template.minijinja"
json_mode = "strict"

# Metrics for feedback
[metrics.task_success]
type = "boolean"
level = "episode"
optimize = "max"

[metrics.quality_score]
type = "float"
level = "inference"
optimize = "max"
